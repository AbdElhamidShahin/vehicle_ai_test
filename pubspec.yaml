name: vehicle_ai_test
description: "Prototype: voice-based vehicle data entry, direct Gemini API."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  record: ^6.1.2        # audio recording
  http: ^1.5.0          # REST calls to Gemini
  path_provider: ^2.1.5 # temp directory for audio file
  share_plus: ^12.0.2
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.3
  speech_to_text: ^7.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
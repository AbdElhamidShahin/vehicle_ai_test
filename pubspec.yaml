name: vehicle_ai_test
description: "Vehicle voice data collection app - Flutter client ready for Firebase Cloud Function AI backend."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  record: ^6.1.2
  http: ^1.5.0
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  firebase_core: ^4.14.0
  firebase_ai: ^4.0.0
  firebase_app_check: ^0.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
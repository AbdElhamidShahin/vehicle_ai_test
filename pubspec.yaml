publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── On-device STT (whisper.cpp) ──────────────────────────────────────────

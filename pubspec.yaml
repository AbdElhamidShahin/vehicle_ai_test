  # ── LLM extraction ───────────────────────────────────────────────────────
  http: ^1.5.0

  # ── Utilities ────────────────────────────────────────────────────────────
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  geolocator: ^14.0.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
